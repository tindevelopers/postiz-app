[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Remove startCommand - let the Docker image use its default entrypoint
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/"
healthcheckTimeout = 300

[env]
PORT = "5000"
# Core app settings
IS_GENERAL = "true"
DISABLE_REGISTRATION = "false"
RUN_CRON = "true"
BACKEND_INTERNAL_URL = "http://localhost:3000"
# Storage
STORAGE_PROVIDER = "local"
UPLOAD_DIRECTORY = "/uploads"
NEXT_PUBLIC_UPLOAD_DIRECTORY = "/uploads"
# Disable Temporal for Railway (single-container deployment)
# TEMPORAL_ADDRESS should be set only if you deploy Temporal separately
