[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Remove startCommand - let the Docker image use its default entrypoint
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/"
healthcheckTimeout = 300

[env]
PORT = "5000"
BACKEND_PORT = "3000"

# CRITICAL: Database connections (required for prisma-db-push during startup)
# Service names must match exactly. Default: Postgis (mellow-energy). 
# New project with Postgres? Override in Railway Dashboard: DATABASE_URL = ${{Postgres.DATABASE_URL}}
DATABASE_URL = "${{Postgis.DATABASE_URL}}"
REDIS_URL = "${{Redis.REDIS_URL}}"

# CRITICAL: JWT Secret for authentication (generate a random string)
# Set this in Railway UI: Variables → JWT_SECRET → [random 32+ character string]
# JWT_SECRET = "your-random-secret-here"

# CRITICAL: URL Configuration (required for authentication/session cookies)
# These MUST be set in Railway UI to match your deployment domain:
# - MAIN_URL = https://[your-railway-domain]
# - FRONTEND_URL = https://[your-railway-domain]
# - NEXT_PUBLIC_BACKEND_URL = https://[your-railway-domain]/api
# - NEXTAUTH_URL = https://[your-railway-domain] (REQUIRED for session cookies!)

# Core app settings
IS_GENERAL = "true"
DISABLE_REGISTRATION = "false"
RUN_CRON = "true"
BACKEND_INTERNAL_URL = "http://localhost:3000"

# Storage
STORAGE_PROVIDER = "local"
UPLOAD_DIRECTORY = "/data/uploads"
NEXT_PUBLIC_UPLOAD_DIRECTORY = "/data/uploads"

# Temporal: Connect to the Temporal Light service
TEMPORAL_ADDRESS = "temporal.railway.internal:7233"

# Volumes for persistent storage
# Railway allows only one volume per service on most plans
# Using a single volume mounted at /data with subdirectories
[[volumes]]
name = "postiz-data"
mountPath = "/data"
