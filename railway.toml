[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Remove startCommand - let the Docker image use its default entrypoint
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/"
healthcheckTimeout = 300

[env]
PORT = "3000"
BACKEND_PORT = "3000"
# Core app settings
IS_GENERAL = "true"
DISABLE_REGISTRATION = "false"
RUN_CRON = "true"
BACKEND_INTERNAL_URL = "http://localhost:3000"
# Storage
STORAGE_PROVIDER = "local"
UPLOAD_DIRECTORY = "/data/uploads"
NEXT_PUBLIC_UPLOAD_DIRECTORY = "/data/uploads"
# Temporal: CRITICAL - Point to the Temporal Frontend service (standalone Temporal template)
# DO NOT use "temporal.railway.internal" (that's the old Temporal Starter Package)
TEMPORAL_ADDRESS = "temporal-frontend.railway.internal:7233"

# Volumes for persistent storage
# Railway allows only one volume per service on most plans
# Using a single volume mounted at /data with subdirectories
[[volumes]]
name = "postiz-data"
mountPath = "/data"
