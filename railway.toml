[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Remove startCommand - let the Docker image use its default entrypoint
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/"
healthcheckTimeout = 300

[env]
PORT = "5000"
# Core app settings
IS_GENERAL = "true"
DISABLE_REGISTRATION = "false"
RUN_CRON = "true"
BACKEND_INTERNAL_URL = "http://localhost:3000"
# Storage
STORAGE_PROVIDER = "local"
UPLOAD_DIRECTORY = "/uploads"
NEXT_PUBLIC_UPLOAD_DIRECTORY = "/uploads"
# Temporal: required when using Railway Temporal Starter so backend/orchestrator can start and login works.
# Use your Temporal service's private hostname (replace "temporal" if your service has a different name).
TEMPORAL_ADDRESS = "temporal.railway.internal:7233"

# Volumes for persistent storage
[[volumes]]
name = "uploads"
mountPath = "/uploads"

[[volumes]]
name = "config"
mountPath = "/config"
